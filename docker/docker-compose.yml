version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pto_postgres
    restart: always
    environment:
      POSTGRES_USER: pto_user
      POSTGRES_PASSWORD: pto_password
      POSTGRES_DB: pto_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pto_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pto_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - pto_redisdata:/data
    command: redis-server --appendonly yes

